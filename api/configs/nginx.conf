events {
}

http {

  upstream falconserver {
    server api:1337;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }


  server {
    client_max_body_size 50M;
    listen 443 ssl;
    listen 80;
    server_name yourdomain.com;

    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/12;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 2a06:98c0::/29;
    # use any of the following two
    real_ip_header CF-Connecting-IP;

    ssl_certificate /ssl/cert.pem;
    ssl_certificate_key /ssl/privkey.key;

    access_log /var/log/nginx/data-access.log combined;

    location / {
      add_header X-Request-Id $pid-$msec-$remote_addr-$request_length always;
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Headers' 'Origin,Content-Type,Accept,Authorization,User-Agent,Referer,Keep-Alive,Range,DNT,Cache-Control,X-Requested-With,If-Modified-Since,If-None-Match,If-Match,Force-Cache-Control,Localization' always;
        add_header 'Access-Control-Expose-Headers' 'Cache-Control,Content-Language,Content-Length,Content-Type,Expires,Last-Modified,Pragma,Content-Range' always;
        add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
        add_header 'Content-Length' 0 always;
        return 204;
      }

      add_header 'Access-Control-Allow-Origin' '*' always;
      add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,HEAD,PUT,DELETE,PATCH' always;
      add_header 'Access-Control-Max-Age' 86400 always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Headers' 'Origin,Content-Type,Accept,Authorization,User-Agent,Referer,Keep-Alive,Range,DNT,Cache-Control,X-Requested-With,If-Modified-Since,If-None-Match,If-Match,Force-Cache-Control,Localization' always;
      add_header 'Access-Control-Expose-Headers' 'Cache-Control,Content-Language,Content-Length,Content-Type,Expires,Last-Modified,Pragma,Content-Range' always;
      proxy_set_header X-Forwarded-Id $remote_addr;
      proxy_set_header X-Request-Id $pid-$msec-$remote_addr-$request_length;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass_request_headers on;
      proxy_pass http://falconserver/; # default loc
    }

    location = /basic_status {
      allow 127.0.0.1;
      stub_status;
    }
  }
}