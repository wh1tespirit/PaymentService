services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: common/dockerimages/python.Dockerfile
    command: sh -c "alembic upgrade head && uvicorn api.asgi:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    environment: &app_env
      PROJECT_NAME: PaymentService
      DATABASE_URI: postgresql+asyncpg://postgres:postgres@postgres:5432/postgres
      RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      API_KEY: ${API_KEY:-secret-api-key}
      OPENAPI_TOKEN: ${OPENAPI_TOKEN:-some-admin-token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: common/dockerimages/python.Dockerfile
    command: faststream run consumer.app:app
    restart: unless-stopped
    environment: *app_env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
